server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Water temperatures for the page, from the SwissWaterTemps container on the same Docker network.
    # Resolved per request, so nginx still starts when swt is down.
    location = /api/water {
        resolver 127.0.0.11 valid=30s;
        set $swt http://swt:3000;
        proxy_pass $swt/api/v1/stations;
        proxy_set_header Accept application/json;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
