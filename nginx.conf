js_import training from /etc/nginx/njs/training.js;
js_fetch_max_response_buffer_size 8m;
js_fetch_timeout 5s;
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Water temperatures for the page, from the SwissWaterTemps container on the same Docker network.
    # Resolved per request, so nginx still starts when swt is down.
    location = /api/water {
        set $swt http://swt:3000;
        proxy_pass $swt/api/v1/stations;
        proxy_set_header Accept application/json;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Training totals for the page, filtered from the training dashboard by njs (see njs/training.js).
    location = /api/training {
        js_content training.training;
    }
}
